<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍳 Jeu de Cuisine - Combinaison d'Ingrédients</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🍳 Masterchef Cuisine</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Points:</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Niveau:</span>
                    <span class="stat-value" id="level">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Plats Créés:</span>
                    <span class="stat-value" id="dishes">0</span>
                </div>
            </div>
        </header>

        <!-- Main Game Area -->
        <div class="game-area">
            <!-- Ingredients Panel -->
            <div class="ingredients-panel">
                <h2>🥘 Ingrédients Disponibles</h2>
                <div class="ingredients-grid" id="ingredientsGrid">
                    <!-- Les ingrédients seront générés par JS -->
                </div>
            </div>

            <!-- Cooking Area -->
            <div class="cooking-area">
                <h2>🍲 Zone de Cuisson</h2>
                <div class="pot">
                    <div class="pot-content" id="potContent">
                        <p class="empty-text">Glissez les ingrédients ici</p>
                    </div>
                </div>

                <!-- Combined Ingredients Display -->
                <div class="combined-ingredients">
                    <h3>Ingrédients Combinés:</h3>
                    <div id="combinedList" class="combined-list">
                        <p class="empty-text">Aucun ingrédient</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="btn btn-cook" id="cookBtn" disabled>
                        🔥 Cuire le Plat
                    </button>
                    <button class="btn btn-reset" id="resetBtn">
                        🗑️ Réinitialiser
                    </button>
                </div>
            </div>

            <!-- Recipes Panel -->
            <div class="recipes-panel">
                <h2>📖 Recettes Disponibles</h2>
                <div class="recipes-list" id="recipesList">
                    <!-- Les recettes seront générées par JS -->
                </div>
            </div>
        </div>

        <!-- Success Modal -->
        <div class="modal" id="successModal">
            <div class="modal-content success">
                <span class="close" id="closeModal">&times;</span>
                <h2 id="modalTitle">🎉 Félicitations!</h2>
                <p id="modalMessage"></p>
                <div class="recipe-details" id="recipeDetails"></div>
                <p id="modalPoints" class="points"></p>
                <button class="btn btn-primary" id="continueBtn">Continuer</button>
            </div>
        </div>

        <!-- Error Modal -->
        <div class="modal" id="errorModal">
            <div class="modal-content error">
                <span class="close" id="closeErrorModal">&times;</span>
                <h2>❌ Ce n'est pas une recette valide</h2>
                <p id="errorMessage"></p>
                <button class="btn btn-primary" id="tryAgainBtn">Réessayer</button>
            </div>
        </div>
    </div>

    <script src="recipes.js"></script>
    <script src="game.js"></script>
</body>
</html>
